services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sneaker
      POSTGRES_PASSWORD: sneaker
      POSTGRES_DB: sneaker_drop
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - sneaker_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sneaker -d sneaker_drop"]
      interval: 2s
      timeout: 3s
      retries: 20
  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: sneaker
      POSTGRES_PASSWORD: sneaker
      POSTGRES_DB: sneaker_drop_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sneaker -d sneaker_drop_test"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  sneaker_data:
